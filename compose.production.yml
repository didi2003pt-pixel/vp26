services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]

  redis:
    image: ${REDIS_IMAGE:-redis:8-bookworm}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?}"]
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]

  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE to a versioned image or digest}
    restart: unless-stopped
    env_file: .env.production
    networks: [backend, frontend]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 5

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.28-bookworm}
    restart: unless-stopped
    ports: ["443:443"]
    volumes:
      - ./ops/nginx/desafio-volta.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ops/nginx/proxy_params:/etc/nginx/proxy_params:ro
      - ${TLS_CERT_DIR:?}:/etc/nginx/tls:ro
    networks: [frontend]
    depends_on: [web]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]

networks:
  backend:
    internal: true
  frontend:

volumes:
  postgres_data:
  redis_data:
