services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: desafio_volta
      POSTGRES_USER: desafio
      POSTGRES_PASSWORD: desafio_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desafio -d desafio_volta"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: desafio
      MINIO_ROOT_PASSWORD: desafio_local_storage
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://desafio:desafio_local@postgres:5432/desafio_volta?schema=public
      DIRECT_URL: postgresql://desafio:desafio_local@postgres:5432/desafio_volta?schema=public
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      S3_ENDPOINT: http://minio:9000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
